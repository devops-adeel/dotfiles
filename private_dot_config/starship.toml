# Basic configuration - optimized for M3 Pro MacBook Pro
add_newline = false
palette = "catppuccin_mocha"
command_timeout = 300  # M3 Pro can handle much faster command execution
scan_timeout = 30      # Quick scanning with M3 Pro performance

# Left prompt format - minimal but informative with Claude awareness
format = """
$directory\
$git_branch\
$git_status\
$env_var\
$character
"""

# Right prompt format - enhanced for M3 Pro capabilities with performance monitoring
right_format = """
$cmd_duration\
$status\
$memory_usage\
$docker_context\
$nodejs\
$python\
$rust\
$golang\
$terraform\
$custom\
"""

# Directory configuration
[directory]
style = "bold blue"
read_only = " 󰌾"
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true

# Git branch configuration
[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"
truncation_length = 20

# Git status configuration
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold green"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"
ignore_submodules = true
disabled = false

# Command duration - optimized for M3 Pro performance monitoring
[cmd_duration]
min_time = 1000  # M3 Pro makes most operations fast, show only slower ones
format = "[took $duration]($style) "
style = "yellow"
show_milliseconds = true  # M3 Pro precision timing

# Character - Claude Code aware
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
vimcmd_symbol = "[V](bold green)"

# Status module
[status]
format = "[$symbol$status]($style) "
symbol = "✖ "
style = "bold red"
disabled = false

# Docker context
[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
style = "blue"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile", "docker-compose.test.yml"]
disabled = false

