# Ghostty Balanced Profile - Balanced Performance Mode
# Optimized for everyday use on M3 Pro MacBook Pro
# This profile balances performance with resource usage

# Include base configuration
config-file = /Users/adeel/Library/Application Support/com.mitchellh.ghostty/config

# Performance settings - balanced
window-vsync = true
unfocused-split-opacity = 0.95
cursor-style = block
cursor-style-blink = true

# Visual settings - moderate
window-decoration = true
window-padding-x = 6
window-padding-y = 6
window-padding-balance = true

# Font rendering - balanced quality
font-size = 13
adjust-cell-height = 1
font-feature = calt
font-feature = liga

# Theme
theme = dark:catppuccin-mocha

# GPU acceleration - standard
gtk-single-instance = true

# Scrollback - moderate buffer
scrollback-limit = 5000

# Bell - subtle feedback
audible-bell = false
visual-bell = true
bell-animation = flash

# Window behavior
focus-follows-mouse = false
mouse-hide-while-typing = true

# Copy on select
copy-on-select = true
clipboard-paste-protection = true

# Shell integration
shell-integration = detect
shell-integration-features = cursor,sudo,title

# Title bar
window-title-strategy = app_dir_process