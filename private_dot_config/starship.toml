fi
"""
when = "true"
format = "[$output]($style) "
style = "bold green"
shell = ["bash", "-c"]
disabled = false

# Neovim Context Bridge - Updates context for nvim to consume
[custom.nvim_bridge]
command = """
# Update context bridge for nvim
$HOME/.config/nvim/scripts/update-nvim-context.sh 2>/dev/null
# Return empty string so nothing shows in prompt
echo ""
"""
when = "true"
format = ""  # Don't display anything
shell = ["bash", "-c"]
disabled = false
