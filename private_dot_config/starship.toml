# =============================================================================
# Performance-Aware Segments
# =============================================================================
# These segments adapt based on system performance state

# Performance mode indicator - shows current optimization level
[custom.perf_mode]
command = """
state=$(cat /tmp/terminal-perf-state 2>/dev/null || echo "balanced")
case $state in
    throttled) echo "🍃eco" ;;
    eco) echo "🍃eco" ;;
    balanced) echo "🔋bal" ;;
    performance) echo "⚡perf" ;;
    *) echo "" ;;
esac
"""
when = 'test -f /tmp/terminal-perf-state'
format = "[$output]($style) "
style = "bold yellow"
shell = ["bash", "-c"]
disabled = false

# Simplified load indicator based on performance state
[custom.load_indicator]
command = """
state=$(cat /tmp/terminal-perf-state 2>/dev/null || echo "balanced")
case $state in
    eco) echo "🌡️" ;;
    throttled) echo "🔥" ;;
    *) echo "" ;;
esac
"""
when = 'test -f /tmp/terminal-perf-state'
format = "[$output]($style) "
style = "bold red"
shell = ["bash", "-c"]
disabled = false

# CPU load indicator - simplified without bc
[custom.cpu_load]
command = """
load=$(sysctl -n vm.loadavg 2>/dev/null | awk '{print int($1)}')
if [ "$load" -gt 6 ]; then
  echo "🚨$load"
elif [ "$load" -gt 4 ]; then
  echo "⚠️$load"
fi
"""
when = '[[ "${TERMINAL_PERF_MODE:-balanced}" != "eco" ]]'
format = "[$output]($style) "
style = "bold orange"
shell = ["bash", "-c"]
disabled = false

# Battery-aware indicator - shows when on battery with performance implications
[custom.battery_perf]
command = """
if pmset -g batt 2>/dev/null | grep -q "Battery Power"; then
  state=$(cat /tmp/terminal-perf-state 2>/dev/null || echo "balanced")
  if [ "$state" = "performance" ]; then
    echo "🔋⚠️"  # Warning: high performance on battery
  elif [ "$state" = "eco" ]; then
    echo "🔋✓"   # Good: eco mode on battery
  fi
fi
"""
when = 'pmset -g batt 2>/dev/null | grep -q "Battery Power"'
format = "[$output]($style) "
style = "bold yellow"
shell = ["bash", "-c"]
disabled = false

# Claude Code specific configurations
[env_var.CLAUDE_SESSION]
variable = "CLAUDE_SESSION"
symbol = "🤖 "
format = "[$symbol]($style)"
style = "bold mauve"
disabled = false

[env_var.ANTHROPIC_API_KEY]
variable = "ANTHROPIC_API_KEY"
symbol = "🧠 "
format = "[$symbol]($style)"
style = "bold blue"
disabled = false

[custom.claude_project]
command = """
if [ -f ".claude/settings.json" ]; then
  echo "📁"
elif [ -f "CLAUDE.md" ]; then
  echo "📝"
fi
"""
when = '[ -f ".claude/settings.json" ] || [ -f "CLAUDE.md" ]'
format = "[$output]($style) "
style = "bold purple"
shell = ["bash", "-c"]
disabled = false

[custom.ai_models]
command = """
if [ -n "$OPENAI_API_KEY" ] && [ -n "$ANTHROPIC_API_KEY" ]; then
  echo "🔗"
elif [ -n "$OPENAI_API_KEY" ]; then
  echo "🔧"
elif [ -n "$ANTHROPIC_API_KEY" ]; then
  echo "🧠"
fi
"""
when = '[ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$GOOGLE_API_KEY" ] || [ -n "$GROQ_API_KEY" ]'
format = "[$output]($style) "
style = "bold yellow"
shell = ["bash", "-c"]
disabled = false

[custom.pydantic_ai]
command = """
if grep -q "pydantic-ai" pyproject.toml 2>/dev/null || grep -q "pydantic-ai" requirements.txt 2>/dev/null; then
  echo "🤖"
fi
"""
when = '[ -f "pyproject.toml" ] || [ -f "requirements.txt" ]'
format = "[$output]($style) "
style = "bold green"
shell = ["bash", "-c"]
disabled = false

[custom.test_status]
command = """
if [ -d "tests/" ]; then
  count=$(find tests/ -name "*.py" -not -name "__init__.py" 2>/dev/null | wc -l | tr -d ' ')
  if [ "$count" -gt 0 ]; then
    echo "🧪$count"
  fi
fi
"""
when = '[ -d "tests/" ]'
format = "[$output]($style) "
style = "bold cyan"
shell = ["bash", "-c"]
disabled = false

[custom.make_available]
command = """
if [ -f "Makefile" ]; then
  echo "⚡"
fi
"""
when = '[ -f "Makefile" ]'
format = "[$output]($style) "
style = "bold peach"
shell = ["bash", "-c"]
disabled = false

[custom.container_status]
command = """
if [ -f "docker-compose.yml" ] || [ -f "Dockerfile" ]; then
  if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
    echo "🐳"
  else
    echo "📦"
  fi
fi
"""
when = '[ -f "docker-compose.yml" ] || [ -f "Dockerfile" ]'
format = "[$output]($style) "
style = "bold blue"
shell = ["bash", "-c"]
disabled = false

# M3 Pro specific optimizations
[custom.m3_pro_indicator]
command = """
if system_profiler SPHardwareDataType 2>/dev/null | grep -q "Apple M3 Pro"; then
  echo "⚡"
fi
"""
when = "true"
format = "[$output]($style) "
style = "bold green"
shell = ["bash", "-c"]
disabled = false

[custom.unified_memory]
command = """
if system_profiler SPHardwareDataType 2>/dev/null | grep -q "Memory: 36 GB"; then
  echo "🧠36GB"
fi
"""
when = "true"
format = "[$output]($style) "
style = "bold cyan"
shell = ["bash", "-c"]
disabled = false

# Thermal state disabled - pmset thermlog can hang
# Use perf-check alias to manually check system state instead
[custom.thermal_state]
disabled = true

[custom.performance_cores]
command = """
if system_profiler SPHardwareDataType 2>/dev/null | grep -q "6 performance and 6 efficiency"; then
  echo "💻12"
fi
"""
when = "true"
format = "[$output]($style) "
style = "bold yellow"
shell = ["bash", "-c"]
disabled = false

[custom.metal_acceleration]
command = """
if system_profiler SPDisplaysDataType 2>/dev/null | grep -q "Metal" || [ -n "$PYTORCH_ENABLE_MPS_FALLBACK" ]; then
  echo "🔬"
fi
"""
when = "true"
format = "[$output]($style) "
style = "bold purple"
shell = ["bash", "-c"]
disabled = false

[custom.rosetta_detection]
command = """
if pgrep -f "oahd" >/dev/null 2>&1; then
  echo "🔄"
fi
"""
when = "true"
format = "[$output]($style) "
style = "bold orange"
shell = ["bash", "-c"]
disabled = false

[custom.high_power_mode]
