# Ghostty Performance Profile - Maximum Performance Mode
# Optimized for M3 Pro MacBook Pro when plugged in and running cool
# This profile prioritizes visual quality and responsiveness

# Include base configuration
config-file = /Users/adeel/Library/Application Support/com.mitchellh.ghostty/config

# Performance settings - maximum quality
window-vsync = true
unfocused-split-opacity = 0.85
cursor-style = block
cursor-style-blink = true

# Visual enhancements
window-decoration = true
window-padding-x = 8
window-padding-y = 8
window-padding-balance = true

# Font rendering - highest quality
font-size = 14
adjust-cell-height = 2
font-feature = calt
font-feature = liga
font-feature = dlig

# Theme - full color depth
theme = dark:catppuccin-mocha

# GPU acceleration - maximum
gtk-single-instance = true

# Scrollback - generous buffer
scrollback-limit = 10000

# Bell - visual feedback enabled
audible-bell = false
visual-bell = true
bell-animation = bounce

# Window behavior
focus-follows-mouse = false
mouse-hide-while-typing = true

# Copy on select for efficiency
copy-on-select = true
clipboard-paste-protection = true

# Shell integration
shell-integration = detect
shell-integration-features = cursor,sudo,title

# Title bar shows current directory
window-title-strategy = app_dir_process