# Ghostty Eco Profile - Power Saving / Thermal Throttled Mode
# Optimized for battery usage and high temperature situations on M3 Pro
# This profile minimizes resource usage while maintaining usability

# Include base configuration
config-file = /Users/adeel/Library/Application Support/com.mitchellh.ghostty/config

# Performance settings - minimum overhead
window-vsync = false
unfocused-split-opacity = 1.0
cursor-style = block
cursor-style-blink = false

# Visual settings - minimal
window-decoration = true
window-padding-x = 4
window-padding-y = 4
window-padding-balance = true

# Font rendering - optimized for performance
font-size = 12
adjust-cell-height = 0
# Disable ligatures for performance
font-feature = -calt
font-feature = -liga
font-feature = -dlig

# Theme - simple colors
theme = dark:catppuccin-mocha

# GPU acceleration - minimal
gtk-single-instance = false

# Scrollback - limited buffer to save memory
scrollback-limit = 1000

# Bell - no animations
audible-bell = false
visual-bell = false

# Window behavior - simplified
focus-follows-mouse = false
mouse-hide-while-typing = true

# Copy on select - still enabled for productivity
copy-on-select = true
clipboard-paste-protection = true

# Shell integration - basic features only
shell-integration = detect
shell-integration-features = cursor,title

# Title bar - simple
window-title-strategy = process